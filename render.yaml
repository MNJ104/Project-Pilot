databases:
  - name: pilot-postgres
    databaseName: project_pilot
    user: pilot_user
    plan: free

services:
  # -------------------------------------------------------------
  # 1. FastAPI AI Microservice (Python)
  # -------------------------------------------------------------
  - type: web
    name: pilot-ai-service
    env: python
    plan: free
    rootDir: apps/ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health


    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: GEMINI_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production



  # -------------------------------------------------------------
  # 2. Spring Boot Core Backend (Java)
  # -------------------------------------------------------------
  - type: web
    name: pilot-backend
    env: docker
    plan: free
    rootDir: apps/backend
    dockerfilePath: Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: pilot-postgres
          property: connectionString
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: pilot-ai-service
          property: host
      - key: JWT_SECRET
        generateValue: true

  # -------------------------------------------------------------
  # 3. React Vite Web Dashboard (Frontend SPA)
  # -------------------------------------------------------------
  - type: web
    name: pilot-web-dashboard
    env: static
    rootDir: apps/web-dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: pilot-backend
          property: host
